<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007aff">
<!-- [优化1] 新增 iOS PWA 元信息：添加到主屏幕后以独立应用形态运行，状态栏与标题更贴合 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="专注计时器">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>随机提示音专注计时器</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#f4f4f7;
    --text:#1d1d1f;
    --sub:#86868b;
    --accent:#007aff;
    --green:#28c840;
    --red:#ff453a;
    --pill:rgba(255,255,255,.62);
    --pill-border:rgba(255,255,255,.8);
    --hairline:rgba(0,0,0,.06);
    --input-bg:rgba(118,118,128,.1);
    --btn-sec:rgba(118,118,128,.12);
    --shadow-pill:0 8px 30px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);
    --shadow-pop:0 24px 70px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.07);
  }
  html[data-theme="dark"]{
    --bg:#0a0a0d;
    --text:#f5f5f7;
    --sub:#98989f;
    --accent:#0a84ff;
    --green:#32d74b;
    --red:#ff6961;
    --pill:rgba(32,32,36,.6);
    --pill-border:rgba(255,255,255,.09);
    --hairline:rgba(255,255,255,.09);
    --input-bg:rgba(118,118,128,.18);
    --btn-sec:rgba(118,118,128,.22);
    --shadow-pill:0 8px 30px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
    --shadow-pop:0 24px 70px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.4);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex; flex-direction:column;
    overflow-x:hidden;
    transition:background .4s,color .4s;
  }
  /* 主题切换时，主内容区文字/圆环/按钮颜色平滑过渡（与背景晕染同节奏） */
  .phase-label,.time-text,.time-sub,.time-range,.hint,.ring-fg,.ring-bg,.stat .num,.stat .lbl,
  .brand,.btn,.tb-btn,.adjust-btn,.panel,.seg-btn,.field label,.vol-val,.about-name,.about-desc,.about-meta{
    transition:color .45s ease, stroke .45s ease, background-color .45s ease, border-color .45s ease;
  }
  /* 氛围背景光斑 */
  .blob{ position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:0; }
  .blob1{ width:640px;height:640px; background:radial-gradient(circle,#a8cdfc,#c5bbf7); top:-220px; left:-160px; opacity:.55; }
  .blob2{ width:560px;height:560px; background:radial-gradient(circle,#ffc2cf,#f5c6f7); bottom:-220px; right:-140px; opacity:.5; }
  .blob3{ width:420px;height:420px; background:radial-gradient(circle,#a9ecd0,#a8e6f5); top:45%; left:60%; opacity:.4; }
  html[data-theme="dark"] .blob{ opacity:.17; }
  /* ---------- 顶部胶囊导航 ---------- */
  .topbar{
    position:relative; z-index:2;
    width:min(960px, calc(100vw - 48px));
    margin:22px auto 0;
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 12px 11px 22px;
    background:var(--pill); border:1px solid var(--pill-border); border-radius:100px;
    backdrop-filter:blur(30px) saturate(1.8); -webkit-backdrop-filter:blur(30px) saturate(1.8);
    box-shadow:var(--shadow-pill);
    transition:background .4s,border .4s;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:.3px; user-select:none; }
  .brand .dot{ width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--green),#5eead4); box-shadow:0 0 10px rgba(40,200,64,.55); }
  .top-actions{ display:flex; gap:8px; }
  .tb-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--input-bg); color:var(--sub); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
    transition:color .15s, background .15s, transform .12s;
  }
  .tb-btn:hover{ color:var(--text); background:var(--btn-sec); }
  .tb-btn:active{ transform:scale(.92); }
  .tb-btn.active{ color:var(--accent); background:rgba(0,122,255,.14); border-color:transparent; }
  /* 图标翻转动画：仅 transform+opacity（合成层属性），不触发重排，零卡顿 */
  .tb-btn .tb-ic{ display:inline-block; transition:transform .38s cubic-bezier(.2,.8,.3,1.1), opacity .18s; }
  .tb-btn.spin .tb-ic{ transform:rotate(135deg); }
  /* ---------- 主区域（无框） ---------- */
  main{
    position:relative; z-index:1; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px 0 8px;
  }
  .phase-label{
    font-size:14px; font-weight:600; letter-spacing:2.5px; color:var(--sub);
    display:flex; align-items:center; gap:8px; user-select:none;
  }
  .phase-label .phase-dot{ width:8px; height:8px; border-radius:50%; background:var(--sub); transition:background .3s, box-shadow .3s; }
  .phase-focus .phase-dot{ background:var(--green); box-shadow:0 0 10px var(--green); }
  .phase-rest .phase-dot{ background:var(--red); box-shadow:0 0 10px var(--red); }
  .ring-wrap{ position:relative; width:330px; height:330px; margin:14px 0 4px; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--hairline); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--sub); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .35s linear, stroke .4s; }
  .ring-fg.focus{ stroke:var(--green); filter:drop-shadow(0 0 10px rgba(40,200,64,.35)); }
  .ring-fg.rest{ stroke:var(--red); filter:drop-shadow(0 0 10px rgba(255,69,58,.35)); }
  .timer-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding-top:44px; } /* 补偿下方副文本行，使时间居中于圆心 */
  .time-row{ display:flex; align-items:center; gap:10px; }
  .time-text{
    font-size:68px; font-weight:600; letter-spacing:1px; line-height:1;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  }
  .adjust-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:transparent;
    color:var(--sub); font-size:26px; font-weight:300; cursor:pointer; line-height:1;
    opacity:0; pointer-events:none; transition:opacity .18s, color .15s, background .15s;
    font-family:inherit; flex-shrink:0;
  }
  .adjust-btn:hover{ color:var(--text); background:var(--input-bg); }
  .time-range{ font-size:13.5px; color:var(--sub); font-variant-numeric:tabular-nums; min-height:17px; opacity:0; transition:opacity .18s; letter-spacing:.5px; }
  .ring-wrap.adjusting:hover .adjust-btn,
  .ring-wrap.adjusting:hover .time-range{ opacity:1; }
  .ring-wrap.adjusting:hover .adjust-btn{ pointer-events:auto; }
  @keyframes celebratePop{ 0%{ transform:scale(1); } 35%{ transform:scale(1.045); } 100%{ transform:scale(1); } }
  .ring-wrap.celebrate{ animation:celebratePop .55s cubic-bezier(.2,.8,.3,1.15); }
  /* 尊重系统减少动效偏好：关闭所有装饰性动画 */
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
  /* 主题切换：整页背景晕染扩散 */
  .theme-ripple{
    position:fixed; z-index:100; border-radius:50%; pointer-events:none;
    transform:translate(-50%,-50%) scale(0);
    transition:transform .62s cubic-bezier(.4,.0,.2,1);
  }
  .theme-ripple.go{ transform:translate(-50%,-50%) scale(1); }
  .theme-ripple.to-dark{ background:#0a0a0d; }  /* 亮→暗：黑色扩散 */
  .theme-ripple.to-light{ background:#f4f4f7; } /* 暗→亮：浅色扩散 */
  /* 放弃确认弹窗 */
  .abandon-mask{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.32); opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .abandon-mask.show{ opacity:1; pointer-events:auto; }
  .abandon-box{
    width:300px; padding:22px 22px 16px; border-radius:18px; text-align:center;
    background:var(--pill); border:1px solid var(--pill-border);
    backdrop-filter:blur(40px) saturate(1.8); -webkit-backdrop-filter:blur(40px) saturate(1.8);
    box-shadow:var(--shadow-pop);
    transform:scale(.94) translateY(6px); transition:transform .22s cubic-bezier(.2,.8,.3,1.1);
  }
  .abandon-mask.show .abandon-box{ transform:none; }
  .abandon-title{ font-size:16px; font-weight:700; letter-spacing:.3px; }
  .abandon-desc{ font-size:13px; color:var(--sub); margin-top:9px; line-height:1.5; }
  .abandon-actions{ display:flex; gap:10px; margin-top:18px; }
  .abandon-btn{
    flex:1; border:none; border-radius:11px; padding:9px 0; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit; background:var(--input-bg); color:var(--text);
    transition:filter .15s, transform .12s;
  }
  .abandon-btn:hover{ filter:brightness(1.06); }
  .abandon-btn:active{ transform:scale(.96); }
  .abandon-btn.danger{ color:#ff453a; background:rgba(255,69,58,.12); }
  html[data-theme="dark"] .abandon-btn.danger{ color:#ff6961; background:rgba(255,105,97,.16); }
  .time-sub{ font-size:13px; color:var(--sub); min-height:17px; }
  /* 闭眼休息遮罩 */
  .mini-overlay{
    position:absolute; inset:-6px; border-radius:50%; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:7px;
    background:var(--pill); backdrop-filter:blur(30px) saturate(1.8); -webkit-backdrop-filter:blur(30px) saturate(1.8);
    border:1px solid var(--pill-border); z-index:5;
  }
  .mini-overlay.show{ display:flex; }
  .mini-overlay .mini-title{ font-size:15px; font-weight:600; color:var(--sub); letter-spacing:3px; }
  .mini-overlay .mini-count{ font-size:72px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1; }
  /* 控制按钮 */
  .controls{ display:flex; gap:12px; margin:16px 0 6px; }
  .btn{
    border:none; border-radius:100px; padding:13px 34px; font-size:15px; font-weight:600; cursor:pointer;
    font-family:inherit; letter-spacing:.5px;
    transition:transform .12s, filter .15s;
  }
  .btn:hover{ filter:brightness(1.07); }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-green{ background:var(--green); color:#fff; }
  .btn-ghost{ background:var(--btn-sec); color:var(--text); }
  .btn.hidden{ display:none; }
  .hint{ font-size:12px; color:var(--sub); margin-top:4px; user-select:none; }
  kbd{ background:var(--input-bg); border:1px solid var(--hairline); border-radius:6px; padding:1px 7px; font-family:inherit; font-size:11px; }
  /* ---------- 底部统计胶囊 ---------- */
  .stats-bar{
    position:relative; z-index:2;
    width:fit-content; max-width:calc(100vw - 48px);
    margin:0 auto 26px;
    display:flex;
    background:var(--pill); border:1px solid var(--pill-border); border-radius:100px;
    backdrop-filter:blur(30px) saturate(1.8); -webkit-backdrop-filter:blur(30px) saturate(1.8);
    box-shadow:var(--shadow-pill);
    transition:background .4s,border .4s;
  }
  .stat{ padding:14px 34px; text-align:center; }
  .stat + .stat{ border-left:1px solid var(--hairline); }
  .stat .num{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  .stat .num small{ font-size:11.5px; font-weight:500; color:var(--sub); margin-left:2px; }
  .stat .lbl{ font-size:11px; color:var(--sub); margin-top:2px; }
  .stat.c-green .num{ color:var(--green); }
  .stat.c-blue .num{ color:var(--accent); }
  .stat.c-orange .num{ color:#ff9f0a; }
  /* ---------- 二级面板（设置 / 记录） ---------- */
  .scrim{
    position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.08);
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  html[data-theme="dark"] .scrim{ background:rgba(0,0,0,.35); }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .panel{
    position:fixed; top:86px; right:max(24px, calc((100vw - 960px)/2)); z-index:30;
    width:350px; max-height:calc(100vh - 116px);
    display:flex; flex-direction:column;
    background:var(--pill); border:1px solid var(--pill-border); border-radius:22px;
    backdrop-filter:blur(40px) saturate(1.8); -webkit-backdrop-filter:blur(40px) saturate(1.8);
    box-shadow:var(--shadow-pop);
    opacity:0; transform:translateY(-8px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:opacity .22s, transform .22s;
  }
  .panel.show{ opacity:1; transform:none; pointer-events:auto; }
  .seg{
    display:flex; gap:3px; margin:14px 14px 4px; padding:3px;
    background:var(--input-bg); border-radius:11px;
  }
  .seg-btn{
    flex:1; border:none; border-radius:8px; padding:6px 0; font-size:13px; font-weight:600;
    background:transparent; color:var(--sub); cursor:pointer; font-family:inherit;
    transition:background .18s, color .18s, box-shadow .18s;
  }
  .seg-btn.active{ background:#fff; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.1); }
  html[data-theme="dark"] .seg-btn.active{ background:rgba(255,255,255,.14); }
  .panel-body{ overflow-y:auto; padding:8px 20px 16px; scrollbar-width:thin; }
  .panel-page{ display:none; }
  .panel-page.active{ display:block; }
  .group-label{ font-size:11px; font-weight:600; letter-spacing:1px; color:var(--sub); margin:14px 2px 6px; }
  .field{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline); }
  .field:last-of-type{ border-bottom:none; }
  .field label{ font-size:14px; font-weight:500; flex-shrink:0; }
  .field .unit{ font-size:12px; color:var(--sub); margin-left:4px; }
  .num-input{
    width:72px; padding:6px 10px; border-radius:9px; border:none;
    background:var(--input-bg); color:var(--text); font-size:14px; font-weight:600; text-align:center;
    font-family:inherit; font-variant-numeric:tabular-nums; outline:none; transition:box-shadow .2s;
  }
  .num-input:focus{ box-shadow:0 0 0 3.5px rgba(0,122,255,.3); }
  .num-input:disabled{ opacity:.45; }
  .range-pair{ display:flex; align-items:center; gap:6px; }
  .range-pair .num-input{ width:56px; }
  .sound-row{ display:flex; gap:8px; margin-top:2px; }
  .sound-chip{
    flex:1; border:1.5px solid transparent; background:var(--input-bg); border-radius:13px;
    padding:10px 4px; text-align:center; cursor:pointer; transition:all .18s;
    font-size:12.5px; font-weight:500; user-select:none; color:var(--text);
  }
  .sound-chip .s-icon{ font-size:19px; display:block; margin-bottom:3px; }
  .sound-chip.active{ border-color:var(--accent); color:var(--accent); font-weight:700; background:rgba(0,122,255,.1); }
  .sound-chip:active{ transform:scale(.96); }
  .warn-text{ font-size:12px; color:#ff9f0a; margin-top:9px; min-height:15px; }
  /* 音量 */
  .vol-head{ display:flex; justify-content:space-between; align-items:center; }
  .vol-val{ font-size:12.5px; font-weight:600; color:var(--sub); font-variant-numeric:tabular-nums; }
  .vol-row{ display:flex; align-items:center; gap:10px; }
  .vol-icon{ font-size:16px; width:22px; text-align:center; cursor:pointer; user-select:none; flex-shrink:0; transition:transform .15s; }
  .vol-icon:active{ transform:scale(.85); }
  .vol-slider{
    flex:1; -webkit-appearance:none; appearance:none; height:5px; border-radius:3px; cursor:pointer; outline:none;
    background:linear-gradient(to right, var(--accent) var(--fill,100%), var(--input-bg) var(--fill,100%));
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%; background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); cursor:pointer; transition:transform .15s;
  }
  .vol-slider::-webkit-slider-thumb:hover{ transform:scale(1.15); }
  .vol-slider::-moz-range-thumb{
    width:17px; height:17px; border:none; border-radius:50%; background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer;
  }
  /* [优化2] Firefox 下默认轨道/进度条有不透明背景，会盖住输入框上的渐变填充；
     置为透明后，音量已填充/未填充的蓝色渐变在 Firefox 中与 Chrome 表现一致 */
  .vol-slider::-moz-range-track{ background:transparent; border:none; }
  .vol-slider::-moz-range-progress{ background:transparent; }
  /* 关于 */
  .about{
    margin-top:16px; padding:14px 4px 4px;
    border-top:1px solid var(--hairline);
    text-align:center; user-select:none;
  }
  .about-name{ font-size:13px; font-weight:700; letter-spacing:.5px; }
  .about-desc{ font-size:11.5px; color:var(--sub); margin-top:4px; }
  .about-meta{ font-size:11px; color:var(--sub); margin-top:8px; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
  .about-sep{ opacity:.5; }
  .log-list{ display:flex; flex-direction:column; }
  .log-item{ display:flex; gap:9px; align-items:baseline; padding:9px 2px; border-bottom:1px solid var(--hairline); font-size:13px; }
  .log-item:last-child{ border-bottom:none; }
  .log-time{ font-variant-numeric:tabular-nums; color:var(--sub); font-size:12px; flex-shrink:0; }
  .log-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; align-self:center; }
  .log-chime .log-dot{ background:#ff9f0a; }
  .log-rest .log-dot{ background:var(--red); }
  .log-focus .log-dot{ background:var(--green); }
  .log-info .log-dot{ background:var(--accent); }
  .log-empty{ color:var(--sub); font-size:13px; text-align:center; padding:26px 0; }
</style>
</head>
<body>
  <div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>随机提示音专注计时器</div>
    <div class="top-actions">
      <!-- [优化3] 图标按钮补充 aria-label，屏幕阅读器可识别；type="button" 避免未来被包进 form 时误提交 -->
      <button type="button" class="tb-btn" id="panelBtn" title="设置与记录" aria-label="设置与记录"><span class="tb-ic">⚙︎</span></button>
      <button type="button" class="tb-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换浅色 / 深色"><span class="tb-ic" id="themeIc">🌙</span></button>
    </div>
  </header>
  <main>
    <div class="phase-label" id="phaseLabel"><span class="phase-dot"></span><span id="phaseText">准备开始</span></div>
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 300 300" focusable="false" aria-hidden="true">
        <circle class="ring-bg" cx="150" cy="150" r="132"></circle>
        <circle class="ring-fg" id="ringFg" cx="150" cy="150" r="132"></circle>
      </svg>
      <div class="timer-center">
        <div class="time-row">
          <button type="button" class="adjust-btn" id="minusBtn" title="减少 5 分钟" aria-label="减少 5 分钟">−</button>
          <div class="time-text" id="timeText">90:00</div>
          <button type="button" class="adjust-btn" id="plusBtn" title="增加 5 分钟" aria-label="增加 5 分钟">+</button>
        </div>
        <div class="time-range" id="timeRange"></div>
        <div class="time-sub" id="timeSub">点击开始，进入专注</div>
      </div>
      <div class="mini-overlay" id="miniOverlay">
        <div class="mini-title">闭眼休息</div>
        <div class="mini-count" id="miniCount">10</div>
        <div class="mini-title" style="letter-spacing:1px;font-size:12px;">秒后继续专注</div>
      </div>
    </div>
    <div class="controls" id="controls">
      <button type="button" class="btn btn-green" id="startBtn">开始专注</button>
      <button type="button" class="btn btn-primary hidden" id="pauseBtn">暂停</button>
      <button type="button" class="btn btn-ghost hidden" id="stopBtn">结束</button>
      <button type="button" class="btn btn-green hidden" id="restBtn">开始休息</button>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const clampNum = (v,a,b) => Math.min(b, Math.max(a, v));

const LS = { get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },

/* [优化4] HTML 转义工具：renderLogs 用 innerHTML 拼接日志文本，
   虽然当前文本均由程序生成，但日志内容含数字/用户可改的配置，转义可杜绝潜在 XSS */
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* [优化5] 高频渲染元素缓存：render() 每 250ms 执行一次，原先每次都调用近 20 次 getElementById，
   缓存后避免重复 DOM 查询，降低主线程开销（视觉与功能完全不变） */
const dom = {};
['phaseLabel','phaseText','ringWrap','ringFg','timeText','timeRange','timeSub',
 'miniOverlay','miniCount','startBtn','pauseBtn','stopBtn','restBtn',
 'skipRestBtn','doneBtn','statMinutes','statRounds','statChimes'].forEach(id => dom[id] = $(id));
/* ================= 设置（含边界校验） ================= */
const cfg = Object.assign({focus:90, minInt:3, maxInt:5, rest:20, sound:'bell', theme:'light', volume:100}, LS.get('rft_cfg',{}));
function readSettings(){
  let warn = '';
  // num(v, min, max, dflt)：解析失败(空/非数字)用默认值，否则按边界钳制（0 会被钳到下限而非误判为空）
  const num = (v,min,max,dflt)=>{ const n = parseInt(v,10); return Number.isNaN(n) ? dflt : clampNum(n,min,max); };
  let focus = num($('cfgFocus').value, 5, 180, 90);
  let minI  = num($('cfgMinInt').value, 1, 30, 3);
  let maxI  = num($('cfgMaxInt').value, 1, 30, 5);
  let rest  = num($('cfgRest').value, 1, 120, 20);
  if (minI > maxI){ maxI = minI; warn = '提示音间隔下限不能大于上限，已自动调整'; }

  $('warnText').textContent = warn;

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', cfg.theme==='dark' ? '#0a0a0d' : '#007aff');
}
let themeAnimating = false; // [优化7] 防止快速连点主题按钮导致多个 setTimeout/ripple 叠加、主题状态错乱
$('themeBtn').addEventListener('click', e=>{
  if(themeAnimating) return;
  themeAnimating = true;
  const ic = $('themeIc');
  // 图标：先半转淡出 → 换图标 → 转正淡入
  ic.style.transform = 'rotate(-90deg) scale(.6)'; ic.style.opacity = '0';
  // 背景晕染：从点击处扩散一个整页圆形遮罩，新主题色随之铺开
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    const x = e.clientX || innerWidth-70, y = e.clientY || 40;
    const r = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y)); // 覆盖最远角
    const ripple = document.createElement('div');
    ripple.className = 'theme-ripple ' + (cfg.theme==='dark' ? 'to-light' : 'to-dark');
    ripple.style.cssText = `left:${x}px; top:${y}px; width:${r*2}px; height:${r*2}px;`;
    document.body.appendChild(ripple);
    // 强制 reflow 后展开
    requestAnimationFrame(()=>requestAnimationFrame(()=>ripple.classList.add('go')));
    setTimeout(()=>ripple.remove(), 750);
  }
  setTimeout(()=>{
    cfg.theme = cfg.theme==='dark' ? 'light' : 'dark';
    LS.set('rft_cfg', cfg); applyTheme();
    ic.style.transform = ''; ic.style.opacity = '';
    themeAnimating = false; // [优化7] 动画结束后解锁
  }, reduce ? 0 : 480); // 圆即将铺满时切换底层，形成无缝晕染
});
applyTheme();
/* ================= 二级面板（设置 / 记录） ================= */
function openPanel(){ $('panel').classList.add('show'); $('scrim').classList.add('show'); $('panelBtn').classList.add('active','spin'); }
function closePanel(){ $('panel').classList.remove('show'); $('scrim').classList.remove('show'); $('panelBtn').classList.remove('active','spin'); }
$('panelBtn').addEventListener('click', e=>{ e.stopPropagation();
  $('panelBtn').classList.toggle('spin', !$('panel').classList.contains('show')); // 齿轮随开合旋转
  $('panel').classList.contains('show') ? closePanel() : openPanel(); });
$('scrim').addEventListener('click', closePanel);
document.querySelectorAll('.seg-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel-page').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $(b.dataset.page==='settings' ? 'pageSettings' : 'pageLogs').classList.add('active');
  });
});
/* ================= Web Audio 合成提示音 ================= */
let actx = null, masterGain = null;
function ac(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function master(){ // 主音量总线：所有提示音统一经过它输出
  const a = ac();
  if(!masterGain){
    masterGain = a.createGain();
    masterGain.gain.value = (cfg.volume==null?100:cfg.volume)/100;
    masterGain.connect(a.destination);
  }
  return masterGain;
}
const synth = {
  bell(t){ // 铃声：E6 小三度泛音结构，清晰穿透（经典闹铃/计时铃）
    const a = ac(), f = 1318.5; // E6
    [[1,.6],[1.19,.25],[1.5,.12],[2.01,.07]].forEach(([m,g])=>{
      const o=a.createOscillator(), gn=a.createGain();
      o.type='sine'; o.frequency.value=f*m;
      gn.gain.setValueAtTime(0.0001,t);
      gn.gain.linearRampToValueAtTime(.5*g, t+.006);
      gn.gain.exponentialRampToValueAtTime(.0001, t+2.2);
      o.connect(gn); gn.connect(master());
      o.start(t); o.stop(t+2.3);
    });
  },
  ding(t){ // 叮：A6 唱钵/风铃式纯净长音（正念/番茄钟提示音）
    const a = ac(), f = 1760; // A6
    [[1,.55],[2.76,.1],[5.4,.04]].forEach(([m,g])=>{
      const o=a.createOscillator(), gn=a.createGain();
      o.type='sine'; o.frequency.value=f*m;
      gn.gain.setValueAtTime(0.0001,t);
      gn.gain.linearRampToValueAtTime(.5*g, t+.004);
      gn.gain.exponentialRampToValueAtTime(.0001, t+3.2);
      o.connect(gn); gn.connect(master());
      o.start(t); o.stop(t+3.3);
    });
  },
  chime(t){ // 报时：sol-do 上行纯五度双音（系统提醒/番茄钟结束常用）
    const a = ac();
    [[783.99,0],[1046.5,.2]].forEach(([f,dt])=>{ // G5 -> C6
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+dt);
      g.gain.linearRampToValueAtTime(.55,t+dt+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+dt+1.1);
      o.connect(g); g.connect(master()); o.start(t+dt); o.stop(t+dt+1.2);
    });
  },
  wood(t){ // 木鱼：E5 音头快速下坠 + 木质噪声敲击（更脆更实）
    const a = ac();
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(659,t); // E5
    o.frequency.exponentialRampToValueAtTime(440,t+.05); // 快速下坠到 A4
    g.gain.setValueAtTime(1,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g); g.connect(master()); o.start(t); o.stop(t+.14);
    const len=a.sampleRate*.025, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const n=a.createBufferSource(); n.buffer=buf;
    const ng=a.createGain(); ng.gain.setValueAtTime(.4,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.025);
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=1.2;
    n.connect(bp); bp.connect(ng); ng.connect(master()); n.start(t);
  },
  xylo(t){ // 木琴：C6 木质敲击 + 高泛音（厨房/运动计时器常用）
    const a = ac(), f = 1046.5; // C6
    [[1,.75],[4.2,.22],[10.6,.06]].forEach(([m,g])=>{
      const o=a.createOscillator(), gn=a.createGain();
      o.type='sine'; o.frequency.value=f*m;
      gn.gain.setValueAtTime(0.0001,t);
      gn.gain.linearRampToValueAtTime(.55*g, t+.003);
      gn.gain.exponentialRampToValueAtTime(.0001, t+.45);
      o.connect(gn); gn.connect(master());
      o.start(t); o.stop(t+.5);
    });
  },
  beep(t){ // 电子音：A5 双连正弦哔哔，柔和不刺耳（微波炉/电子表提醒）
    const a = ac();
    [[880,0],[880,.25]].forEach(([f,dt])=>{ // A5 两声
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+dt);
      g.gain.exponentialRampToValueAtTime(.3,t+dt+.01);
      g.gain.setValueAtTime(.3,t+dt+.12);
      g.gain.exponentialRampToValueAtTime(.0001,t+dt+.16);
      o.connect(g); g.connect(master()); o.start(t+dt); o.stop(t+dt+.2);
    });
  }
};
const SOUND_GAP = {bell:1.6, wood:.4, beep:.55, ding:2, chime:1.4, xylo:.6};
function playChime(times){
  try{
    const a = ac(), t0 = a.currentTime + .03;
    for(let i=0;i<times;i++) synth[cfg.sound](t0 + i*SOUND_GAP[cfg.sound]);
  }catch(e){ console.warn('音频播放失败', e); }
}
// 番茄钟结束专用：三声逐级升调的清脆"叮-叮-叮"（类似滴答清单番茄钟）
function playFinish(){
  try{
    const a = ac(), t0 = a.currentTime + .03;
    [1318.5, 1568, 2093].forEach((f, i)=>{ // E6 -> G6 -> C7 逐级上扬
      const t = t0 + i * .38;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(.5, t+.008);
      g.gain.exponentialRampToValueAtTime(.0001, t+.55);
      o.connect(g); g.connect(master());
      o.start(t); o.stop(t+.6);
    });
  }catch(e){ console.warn('音频播放失败', e); }
}
document.querySelectorAll('.sound-chip').forEach(chip=>{

  chip.addEventListener('keydown', ev=>{

  }

/* ================= 音量 ================= */
let lastVol = 100; // 静音前的音量，用于取消静音时恢复
function applyVolume(){

$('volMute').addEventListener('click', ()=>{
  if(cfg.volume > 0){ lastVol = cfg.volume; cfg.volume = 0; }
  else cfg.volume = lastVol > 0 ? lastVol : 100;

$('volMute').addEventListener('keydown', ev=>{

applyVolume();
/* ================= 统计 & 日志（localStorage） ================= */
// [优化9] 用本地时区手动拼 YYYY-MM-DD，替代 toLocaleDateString('sv')：
// 后者依赖运行环境内置 sv 语言包，极少数精简环境会回退到其他格式导致跨天判断失效
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
};
let stats = LS.get('rft_stats', null);
if(!stats || stats.date !== todayKey()) stats = {date: todayKey(), minutes:0, rounds:0};
let logs = LS.get('rft_logs', []);
function saveStats(){ stats.date = todayKey(); LS.set('rft_stats', stats); }
function addLog(type, text){
  const t = new Date();
  // [优化10] 每条日志带上日期，供 renderLogs 过滤“今日”记录
  logs.unshift({date: todayKey(), time: pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds()), type, text});
  if(logs.length>100) logs.length = 100;
  LS.set('rft_logs', logs);
  renderLogs();
}
function renderLogs(){
  const el = $('logList');
  // [优化10] 只展示今天的日志（原实现把历史所有日志都显示在“今日记录”下，属逻辑缺陷）；
  // 同时对文本做 HTML 转义，杜绝 innerHTML 注入风险
  const today = todayKey();
  const todays = logs.filter(l => (l.date || '') === today);
  if(!todays.length){ el.innerHTML = '<div class="log-empty">暂无记录，开始一轮专注吧</div>'; return; }
  el.innerHTML = todays.map(l =>
    `<div class="log-item log-${escHtml(l.type)}"><span class="log-dot"></span><span class="log-time">${escHtml(l.time)}</span><span>${escHtml(l.text)}</span></div>`
  ).join('');
}
/* ================= 计时状态机（基于时间戳，防后台漂移） ================= */
// idle -> focus <-> mini -> focusDone -> rest -> restDone -> idle
let mode = 'idle';
let paused = false;

let miniEndAt = 0, miniLeft = 0;                      // 10 秒闭眼休息
let chimeAt = null, chimeLeft = null;                 // 下一次随机提示音
let sessionChimes = 0;
let sumMs = 0, sumChimes = 0;                          // 本轮小结快照（专注完成时生成）
let focusAccMs = 0, lastTick = Date.now();            // 专注分钟累计
let roundBaseMins = 0;                                // 本轮开始时 stats.minutes 基线（用于算本轮已专注）
const MINI_MS = 10000, NO_CHIME_TAIL = 5*60000;
const ABANDON_CONFIRM_MS = 30000,   // 超过30秒放弃需弹确认
      RECORD_MIN_MS = 5*60000;      // 满5分钟才据实计入统计
// 本轮到目前为止已实际专注的毫秒数（= 已 flush 进 stats 的分钟 + focusAccMs 零头）
function elapsedFocusMs(){
  const now = Date.now();
  let acc = (stats.minutes - roundBaseMins)*60000 + focusAccMs;
  if(!paused && (mode==='focus'||mode==='mini')) acc += now - lastTick;
  return acc;
}
function scheduleChime(now, remainingMs){
  const lo = cfg.minInt*60, hi = cfg.maxInt*60;
  const randSec = lo + Math.floor(Math.random()*(hi-lo+1)); // 秒级随机
  if (remainingMs - randSec*1000 >= NO_CHIME_TAIL){ chimeAt = now + randSec*1000; }
  else chimeAt = null; // 最后 5 分钟内不再安排
}
function flushFocusMinutes(){
  while(focusAccMs >= 60000){ focusAccMs -= 60000; stats.minutes++; saveStats(); }
}
function startFocus(){
  readSettings();
  ac(); // 借用户手势激活 AudioContext
  const now = Date.now();
  mode='focus'; paused=false;
  totalMs = cfg.focus*60000; endAt = now + totalMs; startAt = now;
  sessionChimes = 0; focusAccMs = 0; roundBaseMins = stats.minutes;
  scheduleChime(now, totalMs);
  setInputsEnabled(false);
  addLog('focus', `开始专注 ${cfg.focus} 分钟`);
  render();
}
function startMini(now){
  mode='mini'; miniEndAt = now + MINI_MS; chimeAt = null;
  sessionChimes++;
  playChime(1);
  addLog('chime', `第 ${sessionChimes} 次提示音响起，闭眼休息 10 秒`);
}
function endMini(now){
  const left = endAt - now; // endAt 未冻结，10 秒已计入专注时间
  mode='focus';
  playChime(1);
  addLog('chime', '休息结束，继续专注');
  if(left <= 0){ focusComplete(); return; }
  scheduleChime(now, left);
}
function focusComplete(){
  flushFocusMinutes();
  mode='focusDone'; paused=false; chimeAt=null;
  stats.rounds++; saveStats();
  sumMs = totalMs; sumChimes = sessionChimes; // 生成本轮小结快照
  playFinish(); // 番茄钟式三声升调结束铃
  addLog('focus', `专注完成 ${fmt(sumMs)}，提示音 ${sumChimes} 次，闭眼休息 ${sumChimes*10} 秒`);
  celebrate();
  render();
}
function celebrate(){ // 完成瞬间圆环弹跳一下（重播需先移除再触发 reflow）
  const w = dom.ringWrap; // [优化5] 使用缓存元素
  w.classList.remove('celebrate'); void w.offsetWidth; w.classList.add('celebrate');
}
function startRest(){
  const now = Date.now();
  mode='rest'; paused=false;
  totalMs = cfg.rest*60000; endAt = now + totalMs; startAt = now;
  addLog('rest', `开始大休息 ${cfg.rest} 分钟`);
  render();
}
function restComplete(){
  mode='restDone'; paused=false;
  playFinish(); // 番茄钟式三声升调结束铃
  addLog('rest', '大休息结束');
  render();
}
function toIdle(msg){
  flushFocusMinutes(); focusAccMs = 0;
  mode='idle'; paused=false; chimeAt=null; chimeLeft=null;
  setInputsEnabled(true);
  if(msg) addLog('info', msg);
  render();
}
/* ================= 放弃本轮（结束按钮 / −减到0 共用） ================= */
// 结算本轮放弃：满5分钟则据实补齐分钟（永不计轮次），不足则全部舍弃
function settleAbandon(){
  const elapsed = elapsedFocusMs();
  if(elapsed >= RECORD_MIN_MS){
    const totalMins = Math.floor(elapsed/60000);          // 本轮应记总分钟
    const flushed = stats.minutes - roundBaseMins;        // 已实时 flush 进 stats 的分钟
    const add = Math.max(0, totalMins - flushed);         // 只补零头，避免重复计
    stats.minutes += add; saveStats();
    addLog('info', `放弃本轮，已专注 ${totalMins} 分钟，已计入统计`);
  }else{
    // 不足5分钟：把已 flush 的零头分钟回退（本轮一律不计）
    const flushed = stats.minutes - roundBaseMins;
    if(flushed > 0){ stats.minutes -= flushed; saveStats(); }
    addLog('info', '放弃本轮，不足 5 分钟未计入统计');
  }
  focusAccMs = 0; // 已手动结算，阻止 toIdle 的 flushFocusMinutes 重复计
}
// 请求放弃：>30秒先弹确认框，否则直接放弃
function requestAbandon(){
  if(mode!=='focus' && mode!=='mini') return;
  const elapsed = elapsedFocusMs(); // [优化11] 只计算一次，原先在函数内重复调用 3 次
  if(elapsed > ABANDON_CONFIRM_MS){
    const mins = Math.floor(elapsed/60000);
    $('abandonDesc').textContent = elapsed >= RECORD_MIN_MS
      ? `本次专注已 ${mins} 分钟，将被记录。`
      : '本次专注不足5分钟，记录将不会被保存。';
    $('abandonMask').classList.add('show');
  }else{
    settleAbandon(); toIdle();
  }
}
function closeAbandon(){ $('abandonMask').classList.remove('show'); }
$('abandonOk').addEventListener('click', ()=>{ closeAbandon(); settleAbandon(); toIdle(); });
$('abandonCancel').addEventListener('click', closeAbandon);
$('abandonMask').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeAbandon(); });
function togglePause(){
  if(!['focus','mini','rest'].includes(mode)) return;
  const now = Date.now();
  if(!paused){
    paused = true;
    if(mode==='focus'){ leftMs = endAt - now; chimeLeft = chimeAt ? chimeAt - now : null; }
    if(mode==='mini'){ miniLeft = miniEndAt - now; leftMs = endAt - now; }
    if(mode==='rest'){ leftMs = endAt - now; }
    addLog('info', '已暂停');
  }else{
    paused = false;
    if(mode==='focus'){ endAt = now + leftMs; chimeAt = chimeLeft!=null ? now + chimeLeft : null; }
    if(mode==='mini'){ miniEndAt = now + miniLeft; endAt = now + leftMs; }
    if(mode==='rest'){ endAt = now + leftMs; }
    addLog('info', '继续');
    lastTick = now;
  }
  render();
}
function adjust(deltaMin){ // 运行中 ±5 分钟
  if(mode!=='focus' && mode!=='rest') return;
  const d = deltaMin*60000, now = Date.now();
  const curLeft = paused ? leftMs : endAt - now;
  if(deltaMin > 0 && curLeft + d > 180*60000) return; // 剩余时长不得超过 180 分钟上限，超出则忽略
  const newLeft = Math.max(0, curLeft + d);
  if(paused) leftMs = newLeft; else endAt = now + newLeft;
  totalMs = Math.max(60000, totalMs + d);
  const left = newLeft;
  if(left <= 0){
    // 减完视为放弃本轮：不计轮次、不响铃、直接回初始页。
    // 走统一放弃流程（按已专注时长决定弹窗与统计），绝不倒扣 stats.minutes。
    if(mode==='focus'){
      requestAbandon();
    }else{ // rest 减到 0：直接结束休息，无需确认/统计
      toIdle('休息时间已减完');
    }
    return;
  }
  if(mode==='focus'){
    const cLeft = paused ? chimeLeft : (chimeAt ? chimeAt - now : null);
    if(cLeft!=null && left - cLeft < NO_CHIME_TAIL){ chimeAt = chimeLeft = null; } // 落入最后 5 分钟则取消
    if(chimeAt==null && chimeLeft==null && deltaMin>0) scheduleChime(now, left); // 加时间后尝试重新安排
    if(paused && chimeLeft==null && chimeAt!=null) chimeLeft = chimeAt - now; // 保持暂停态快照一致
    if(!paused && chimeAt==null && chimeLeft!=null) chimeAt = now + chimeLeft;
  }
  addLog('info', `时间${deltaMin>0?'增加':'减少'} 5 分钟`);
  render();
}
/* ================= 主循环 ================= */
function tick(){
  const now = Date.now();
  if(!paused){
    if(mode==='focus'){
      const left = endAt - now;
      focusAccMs += now - lastTick; flushFocusMinutes();
      if(chimeAt && now >= chimeAt && left > 0) startMini(now);
      else if(left <= 0) focusComplete();
    }else if(mode==='mini'){
      focusAccMs += now - lastTick; flushFocusMinutes(); // 闭眼休息计入专注时间
      if(now >= miniEndAt) endMini(now);
    }else if(mode==='rest'){
      if(now >= endAt) restComplete();
    }
  }
  lastTick = now;
  render();
}
setInterval(tick, 250);
// 标签页从后台切回时立即按真实时间校准（后台期间 setInterval 会被浏览器节流，时间戳计时本身不丢）
// 校准前先把"上次 tick 到此刻"这段被节流跳过的时间补进专注累计，避免统计分钟漏计
function recalibrate(){
  const now = Date.now();
  if(!paused && (mode==='focus'||mode==='mini')) focusAccMs += now - lastTick;
  lastTick = now;
  tick();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) recalibrate(); });
window.addEventListener('focus', recalibrate);
/* ================= 渲染 ================= */
const CIRC = 2*Math.PI*132;
dom.ringFg.style.strokeDasharray = CIRC; // [优化5] 使用缓存元素
function fmt(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return pad(Math.floor(s/60))+':'+pad(s%60); }
function setInputsEnabled(en){ ['cfgFocus','cfgMinInt','cfgMaxInt','cfgRest'].forEach(id=>$(id).disabled=!en); }
function render(){
  const now = Date.now();
  let displayMs, sub='', phase='', ringClass='', progress=0, title='随机提示音专注计时器';
  const leftMsNow = paused ? leftMs : endAt - now;
  switch(mode){
    case 'idle':
      displayMs = cfg.focus*60000; phase='准备开始'; sub='点击开始，进入专注'; progress=0;
      break;
    case 'focus':
      displayMs = leftMsNow; phase='专注中'; ringClass='focus';
      progress = totalMs ? 1 - leftMsNow/totalMs : 0;
      sub = paused ? '已暂停' : '';
      title = `${fmt(displayMs)} 专注中`;
      break;
    case 'mini':
      displayMs = leftMsNow; phase='专注中 · 闭眼休息'; ringClass='focus';
      progress = totalMs ? 1 - leftMsNow/totalMs : 0;
      sub = '';
      title = '闭眼休息 10 秒';
      break;
    case 'focusDone':
      displayMs = sumMs; phase='专注完成'; ringClass='focus'; progress=1;
      sub = sumChimes>0 ? `提示音 ${sumChimes} 次 · 闭眼休息 ${sumChimes*10} 秒` : '全程无提示音打扰';
      title='🎉 专注完成';
      break;
    case 'rest':
      displayMs = leftMsNow; phase='大休息中'; ringClass='rest';
      progress = totalMs ? 1 - leftMsNow/totalMs : 0;
      sub = paused ? '已暂停' : '放松一下吧';
      title = `${fmt(displayMs)} 休息中`;
      break;
    case 'restDone':
      displayMs = 0; phase='休息结束'; ringClass='rest'; progress=1;
      sub = sumMs>0 ? `本轮专注 ${fmt(sumMs)}${sumChimes>0 ? ` · 提示音 ${sumChimes} 次` : ''} · 不会自动开始下一轮` : '本轮完成，不会自动开始下一轮';
      title='✅ 休息结束';
      break;
  }
  // 仅倒计时进行中（focus/rest，含暂停）悬停才显示 ± 按钮与时刻范围
  const adjusting = ['focus','rest'].includes(mode);
  dom.ringWrap.classList.toggle('adjusting', adjusting); // [优化5] 以下均使用缓存元素
  if(adjusting){
    const d1 = new Date(startAt), d2 = new Date(paused ? now + leftMs : endAt);
    dom.timeRange.textContent = pad(d1.getHours())+':'+pad(d1.getMinutes()) + ' - ' + pad(d2.getHours())+':'+pad(d2.getMinutes());
  } else {
    dom.timeRange.textContent = '';
  }
  dom.timeText.textContent = fmt(displayMs);
  dom.timeSub.textContent = sub;
  dom.phaseText.textContent = phase + (paused ? '（已暂停）' : '');
  dom.phaseLabel.className = 'phase-label ' + (ringClass==='rest' ? 'phase-rest' : ringClass==='focus' ? 'phase-focus' : '');
  const ring = dom.ringFg;
  ring.setAttribute('class', 'ring-fg ' + ringClass); // SVG 元素的 className 只读，须用 setAttribute
  ring.style.strokeDashoffset = CIRC * (1 - Math.min(1, Math.max(0, progress)));
  // 闭眼休息遮罩
  const showMini = mode==='mini';
  dom.miniOverlay.classList.toggle('show', showMini);
  if(showMini){
    const ms = paused ? miniLeft : miniEndAt - now;
    dom.miniCount.textContent = Math.max(0, Math.ceil(ms/1000));
  }
  // 按钮可见性
  const vis = {
    startBtn:   mode==='idle',
    pauseBtn:   ['focus','mini','rest'].includes(mode),
    stopBtn:    ['focus','mini'].includes(mode),
    restBtn:    mode==='focusDone',
    skipRestBtn:mode==='focusDone',
    doneBtn:    mode==='restDone' || mode==='rest',
  }; // ± 按钮由 adjusting 悬停样式控制，不做 display 切换
  for(const id in vis) dom[id].classList.toggle('hidden', !vis[id]);
  dom.pauseBtn.textContent = paused ? '继续' : '暂停';
  dom.doneBtn.textContent = mode==='rest' ? '提前结束休息' : '完成，回到准备';
  // 统计
  dom.statMinutes.textContent = stats.minutes;
  dom.statRounds.textContent = stats.rounds;
  dom.statChimes.textContent = sessionChimes;
  // [优化12] 仅在标题变化时写入 document.title，避免每 250ms 触发一次无谓的标题解析
  const fullTitle = (mode==='idle' ? '' : title + ' · ') + '随机提示音专注计时器';
  if(document.title !== fullTitle) document.title = fullTitle;
}
/* ================= 事件绑定 ================= */
$('startBtn').addEventListener('click', startFocus);
$('pauseBtn').addEventListener('click', togglePause);
$('stopBtn').addEventListener('click', requestAbandon);
$('restBtn').addEventListener('click', startRest);
$('skipRestBtn').addEventListener('click', ()=>toIdle('跳过大休息'));
$('doneBtn').addEventListener('click', ()=>{ if(mode==='rest') addLog('rest','提前结束大休息'); toIdle(); });
$('minusBtn').addEventListener('click', ()=>adjust(-5));
$('plusBtn').addEventListener('click', ()=>adjust(5));
// 点击后移除按钮焦点，避免空格键误触发按钮
document.querySelectorAll('button').forEach(b=>b.addEventListener('click', function(){ this.blur(); }));
document.addEventListener('keydown', e=>{
  if(e.code==='Escape'){ if($('abandonMask').classList.contains('show')) closeAbandon(); else closePanel(); return; }
  if(e.code!=='Space' || e.repeat) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(tag)) return;
  e.preventDefault();
  if(['focus','mini','rest'].includes(mode)) togglePause();
  else if(mode==='idle') startFocus();
});
renderLogs();
render();
// 注册 Service Worker（PWA 离线缓存）
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW 注册失败', e));
  });
}
})();
</script>
</body>
</html>
